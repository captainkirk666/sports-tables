<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F1</title>
<script src="https://captainkirk666.github.io/sports-tables/js/loader.js"></script>
<script src="https://captainkirk666.github.io/sports-tables/js/hub-loader.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Genuinely F1-specific: the hero art (now targets ::before, per
     hub.css's fade-mask structure) and the Cormorant Garamond
     import. Every other rule lives in the shared hub.css. */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap');
  .hero::before {
    background-image: url('../assets/logos/f1/f1-hero-art.png');
  }

  /* TEST — F1 only, not yet in the shared hub.css. Plain Roboto
     (not Condensed — that's the nav bar's separate font) for the
     page's general typography. Deliberately does NOT touch the
     hero H1 or the embedded table's own .dt-title — those already
     have their own explicit font-family rules (Cormorant Garamond
     and Roboto Condensed respectively) with higher CSS specificity
     than this plain `body` rule, so they're naturally unaffected
     without needing an explicit exclusion here. The embedded table
     graphic itself is a separate document inside an iframe, so it
     was never going to inherit this either way. */
  body {
    font-family: 'Roboto', sans-serif;
  }
</style>
</head>
<body>

<div id="site-nav" data-active="f1"></div>

<section class="hero">
  <div class="hero-content">
    <h1 id="page-title">F1 Driver Standings</h1>
    <p>Live data. Any style. Your brand.</p>
  </div>

  <div id="table-tabs" class="table-tabs"></div>
</section>

<div class="layout">
  <div class="panel" id="style-theme-panel"></div>
  <div class="panel" id="live-preview-panel"></div>
</div>

<div id="print-surface"></div>

<script src="https://captainkirk666.github.io/sports-tables/js/site-nav.js"></script>
<script data-sport="f1" src="https://captainkirk666.github.io/sports-tables/js/adapter-loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
initSportHub({
  sport: "F1",
  tables: [
    {
      key: "drivers",
      label: "Driver Standings",
      title: "F1 Driver Standings",
      tableLabel: "Driver Standings",
      sportLogo: "../assets/logos/f1/f1-logo.png",
      embedHref: "../embed/f1/drivers.html",
      sourceUrl: F1_ADAPTERS.drivers.sourceUrl,
      adapter: F1_ADAPTERS.drivers,
      attribution: { label: "Jolpica F1" },
      sizeColumns: {
        compact: ["pos", "driver", "points"],
        standard: ["pos", "driver", "team", "points", "wins"]
      }
    },
    {
      key: "constructors",
      label: "Constructor Standings",
      title: "F1 Constructor Standings",
      tableLabel: "Constructor Standings",
      sportLogo: "../assets/logos/f1/f1-logo.png",
      embedHref: "../embed/f1/constructors.html",
      sourceUrl: F1_ADAPTERS.constructors.sourceUrl,
      adapter: F1_ADAPTERS.constructors,
      attribution: { label: "Jolpica F1" },
      sizeColumns: {
        compact: ["pos", "constructor", "points"],
        standard: ["pos", "constructor", "nationality", "points", "wins"]
      }
    },
    {
      key: "results",
      label: "Race Results",
      title: "F1 Race Results",
      tableLabel: "Race Results",
      sportLogo: "../assets/logos/f1/f1-logo.png",
      embedHref: "../embed/f1/results.html",
      sourceUrl: F1_ADAPTERS.raceResults.sourceUrl,
      adapter: F1_ADAPTERS.raceResults,
      attribution: { label: "Jolpica F1" },
      sizeColumns: {
        compact: ["pos", "driver", "points"],
        standard: ["pos", "driver", "team", "points"]
      }
    },
    {
      key: "nextrace",
      label: "Next Race",
      title: "F1 Next Race",
      tableLabel: "Next Race",
      sportLogo: "../assets/logos/f1/f1-logo.png",
      embedHref: "../embed/f1/next-race.html",
      sourceUrl: F1_ADAPTERS.nextRace.sourceUrl,
      adapter: F1_ADAPTERS.nextRace,
      attribution: { label: "Jolpica F1" },
      sizeColumns: {
        compact: ["round", "race", "date"],
        standard: ["round", "race", "circuit", "location", "date", "time"]
      }
    }
  ]
});
</script>

</body>
</html>
