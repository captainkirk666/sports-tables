<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EPL — Table</title>
<script src="https://captainkirk666.github.io/sports-tables/js/loader.js"></script>
<script src="https://captainkirk666.github.io/sports-tables/js/hub-loader.js"></script>
<script src="https://captainkirk666.github.io/sports-tables/js/card-loader.js"></script>
<style>
  /* Genuinely EPL-specific: just the hero art. Everything else
     comes from the shared hub.css (see hub-loader.js). */
  .hero::before {
    background-image: url('../assets/logos/epl/epl-hero-art.png');
  }
</style>
</head>
<body>

<div id="site-nav" data-active="epl"></div>

<section class="hero">
  <div class="hero-content">
    <h1 id="page-title">Premier League</h1>
    <p>Live data. Any style. Your brand.</p>
  </div>

  <div id="table-tabs" class="table-tabs"></div>
</section>

<div class="layout">
  <div class="panel" id="style-theme-panel"></div>
  <div class="panel" id="live-preview-panel"></div>
</div>

<div id="print-surface"></div>

<script src="https://captainkirk666.github.io/sports-tables/js/site-nav.js"></script>
<script data-sport="epl" src="https://captainkirk666.github.io/sports-tables/js/adapter-loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
initSportHub({
  sport: "EPL",
  tables: [
    {
      key: "table",
      label: "League Table",
      title: "EPL League Table",
      tableLabel: "Premier League",
      sportLogo: "../assets/logos/epl/epl-logo.png",
      embedHref: "../embed/epl/table.html",
      sourceUrl: EPL_ADAPTERS.table.sourceUrl,
      adapter: EPL_ADAPTERS.table,
      attribution: { label: "ESPN" },
      sizeColumns: {
        compact: ["pos", "team", "points"],
        standard: ["pos", "team", "played", "gd", "points"]
      }
    }
  ],
  cards: [
    {
      key: "weekend-fixtures",
      label: "EPL Matches",
      title: "EPL Matches",
      tableLabel: "EPL Matches",
      sportLogo: "../assets/logos/epl/epl-logo.png",
      embedHref: "../embed/epl/weekend-fixtures.html",
      adapter: EPL_ADAPTERS.weekendFixtures(),
      variant: "fixture-list",
      eyebrow: "EPL Matches",
      liveTitle: "EPL Matches",
      unsupportedControls: ["flags", "podium"]
    }
  ]
});
</script>

</body>
</html>
