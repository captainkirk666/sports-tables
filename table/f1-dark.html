<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F1 — Driver Standings (Dark Concept)</title>
<link rel="stylesheet" href="../css/v1/tables.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0e14;
    color: #eee;
  }

  /* --- Top nav (self-contained for this test page) --- */
  .dark-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.75rem;
    background: #0b0e14;
    border-bottom: 1px solid #1e2430;
  }
  .dark-nav .brand { font-weight: 700; color: #fff; text-decoration: none; }
  .dark-nav .brand span { color: #e10600; }
  .dark-nav ul { list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; }
  .dark-nav a.nav-link { color: #aaa; text-decoration: none; font-size: 0.9rem; }
  .dark-nav a.nav-link:hover { color: #fff; }

  /* --- Hero banner --- */
  .hero {
    position: relative;
    padding: 3rem 1.75rem;
    background: radial-gradient(circle at 80% 30%, rgba(225,6,0,0.25), transparent 60%),
                linear-gradient(120deg, #0b0e14 0%, #12172a 60%, #1a1030 100%);
    /* Replace the gradient above with your uploaded art:
       background-image: url('../assets/logos/homepage/your-hero-art.png');
       background-size: cover; background-position: center; */
  }
  .hero-inner { display: flex; align-items: center; gap: 1.5rem; }
  .hero-logo { width: 70px; }
  .hero-text h1 { font-size: 2.2rem; margin: 0 0 0.25rem; color: #fff; }
  .hero-text p { margin: 0; color: #999; font-size: 0.95rem; }

  /* --- Table-switcher tabs --- */
  .table-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 1.25rem 1.75rem 0;
  }
  .table-tab {
    border: 1px solid #2a2f3d;
    border-radius: 20px;
    background: #161b26;
    color: #ccc;
    padding: 0.5rem 1.1rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .table-tab.active {
    background: #fff;
    color: #111;
    border-color: #fff;
    font-weight: 600;
  }

  /* --- Two column layout --- */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.5rem;
    padding: 1.5rem 1.75rem 3rem;
    align-items: start;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: #12161f;
    border: 1px solid #1e2430;
    border-radius: 12px;
    padding: 1.25rem;
  }
  .panel h2 {
    font-size: 0.95rem;
    margin: 0 0 1rem;
    color: #fff;
  }

  /* Reused style-tab machinery, restyled for dark sidebar */
  .tier-tabs {
    display: flex; gap: 0.4rem; margin-bottom: 1rem;
  }
  .tier-tab {
    background: #1a1f2b; border: 1px solid #2a2f3d; color: #aaa;
    padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 6px; cursor: pointer;
  }
  .tier-tab.active { background: #e10600; color: #fff; border-color: #e10600; }
  .tier-panel { display: none; }
  .tier-panel.active { display: block; }
  .panel-desc { font-size: 0.8rem; color: #888; margin-bottom: 0.75rem; }

  .preset-swatch {
    display: flex; align-items: center; gap: 0.5rem;
    border: 1px solid #2a2f3d; border-radius: 20px;
    padding: 0.4rem 0.8rem 0.4rem 0.5rem;
    background: #1a1f2b; color: #ccc; cursor: pointer; font-size: 0.8rem;
    margin: 0.2rem 0.3rem 0.2rem 0;
  }
  .preset-swatch.selected { border-color: #fff; color: #fff; font-weight: 600; }
  .swatch-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--swatch-color); display: inline-block; }

  .custom-controls { display: flex; flex-direction: column; gap: 0.75rem; }
  .custom-controls label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #ccc; }
  input[type="color"] { width: 36px; height: 28px; border: 1px solid #2a2f3d; border-radius: 4px; background: #1a1f2b; }

  /* --- Right column: live preview + actions --- */
  .preview-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;
  }
  .preview-header h2 { margin: 0; font-size: 0.95rem; color: #fff; }
  .action-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .action-btn {
    border: 1px solid #2a2f3d; background: #1a1f2b; color: #ccc;
    padding: 0.5rem 0.9rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
  }
  .action-btn.primary { background: #e10600; color: #fff; border-color: #e10600; }
  .action-btn:hover { border-color: #fff; }

  #preview-frame { width: 100%; border: 0; min-height: 500px; border-radius: 10px; overflow: hidden; }

  #embed-code {
    display: block;
    background: #0b0e14; color: #ccc;
    padding: 0.6rem 0.9rem; border-radius: 6px;
    font-size: 0.75rem; margin-top: 0.75rem;
    white-space: pre-wrap; word-break: break-all;
  }
  #embed-code.hidden { display: none; }

  #print-surface { display: none; }
</style>
</head>
<body>

<nav class="dark-nav">
  <a class="brand" href="../index.html">Live<span>Tables</span></a>
  <ul>
    <li><a class="nav-link" href="../index.html">Home</a></li>
    <li><a class="nav-link" href="../style.html">Style options</a></li>
    <li><a class="nav-link" href="../docs.html">Embed guide</a></li>
  </ul>
</nav>

<section class="hero">
  <div class="hero-inner">
    <img class="hero-logo" src="../assets/logos/f1/formula-1-logo.png" alt="F1">
    <div class="hero-text">
      <h1 id="page-title">F1 Driver Standings</h1>
      <p>Live data. Any style. Your brand.</p>
    </div>
  </div>
</section>

<div id="table-tabs" class="table-tabs"></div>

<div class="layout">
  <div class="panel">
    <h2>Style &amp; Theme</h2>

    <div class="tier-tabs">
      <button class="tier-tab active" id="tab-default" onclick="selectTab('default')">Default</button>
      <button class="tier-tab" id="tab-preset" onclick="selectTab('preset')">Presets</button>
      <button class="tier-tab" id="tab-custom" onclick="selectTab('custom')">Custom</button>
    </div>

    <div class="tier-panel active" id="panel-default">
      <p class="panel-desc">Black on white, or its inverse.</p>
      <button class="preset-swatch default-option selected" data-key="classic" onclick="applyDefault()">
        <span class="swatch-dot" style="--swatch-color:#fff; border:1px solid #444;"></span>Classic
      </button>
      <button class="preset-swatch default-option" data-key="reverse" onclick="applyReverse()">
        <span class="swatch-dot" style="--swatch-color:#111;"></span>Reverse
      </button>
    </div>

    <div class="tier-panel" id="panel-preset">
      <p class="panel-desc">Sport-themed presets.</p>
      <div id="preset-swatches"></div>
    </div>

    <div class="tier-panel" id="panel-custom">
      <p class="panel-desc">Tweak the highlight color and background.</p>
      <div class="custom-controls">
        <label><input type="checkbox" id="custom-dark"> Dark background</label>
        <label>Accent color <input type="color" id="custom-color" value="#e10600"></label>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="preview-header">
      <h2>Live preview</h2>
      <div class="action-buttons">
        <button id="toggle-code-btn" class="action-btn">Get embed code</button>
        <button id="download-btn" class="action-btn">Download PDF</button>
        <button id="copy-btn" class="action-btn primary">Copy to clipboard</button>
      </div>
    </div>
    <iframe id="preview-frame"></iframe>
    <code id="embed-code" class="hidden"></code>
  </div>
</div>

<div id="print-surface"></div>

<script src="../js/v1/adapters/f1.js"></script>
<script src="../js/sport-hub.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.min.js"></script>
<script>
initSportHub({
  sport: "F1",
  tables: [
    {
      key: "drivers",
      label: "Driver Standings",
      title: "F1 Driver Standings",
      embedHref: "../embed/f1/drivers.html",
      sourceUrl: F1_ADAPTERS.drivers.sourceUrl,
      adapter: F1_ADAPTERS.drivers,
      attribution: { label: "Jolpica F1" }
    },
    {
      key: "constructors",
      label: "Constructor Standings",
      title: "F1 Constructor Standings",
      embedHref: "../embed/f1/constructors.html",
      sourceUrl: F1_ADAPTERS.constructors.sourceUrl,
      adapter: F1_ADAPTERS.constructors,
      attribution: { label: "Jolpica F1" }
    },
    {
      key: "results",
      label: "Race Results",
      title: "F1 Race Results",
      embedHref: "../embed/f1/results.html",
      sourceUrl: F1_ADAPTERS.raceResults.sourceUrl,
      adapter: F1_ADAPTERS.raceResults,
      attribution: { label: "Jolpica F1" }
    }
  ]
});
</script>

</body>
</html>
