<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live sports data tables — embeddable widgets</title>
<link rel="stylesheet" href="css/site.css?v=2">
<style>
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .tagline { color: #666; margin-top: 0; margin-bottom: 2.5rem; }

  .sport-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    max-width: 720px;
  }
  .sport-card {
    aspect-ratio: 1;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    color: #111;
    padding: 1rem;
    transition: border-color 0.15s, background 0.15s;
  }
  .sport-card:hover {
    border-color: #e10600;
    background: #fafafa;
  }
  .sport-card h2 {
    font-size: 1.1rem;
    margin: 0.4rem 0 0.2rem;
  }
  .sport-card p {
    font-size: 0.78rem;
    color: #666;
    margin: 0;
  }
  .sport-card .sport-icon {
    width: 44px;
    height: 44px;
    object-fit: contain;
  }
  .sport-card .sport-icon.fallback {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #e10600;
  }

  .sport-card.placeholder {
    cursor: default;
    color: #bbb;
    border-style: dashed;
  }
  .sport-card.placeholder:hover {
    border-color: #e2e2e2;
    background: none;
  }
  .sport-card.placeholder .sport-icon {
    background: #eee;
  }
  .sport-card.placeholder h2 { color: #bbb; }

  .footer-note {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 1rem;
    max-width: 720px;
  }
</style>
</head>
<body>

<div id="site-nav" data-active="home"></div>

<main class="site-main">
  <h1>Live sports data tables</h1>
  <p class="tagline">Pick a sport to see its live, embeddable tables.</p>

  <div class="sport-grid" id="sport-grid"></div>

  <p class="footer-note">
    Each sport page includes multiple tables (standings, results, and more),
    theming options, and print-ready PDF export.
  </p>
</main>

<script src="js/site-nav.js"></script>
<script>
/**
 * Home page grid — one card per sport.
 * Add a real sport by giving it an href; leave href empty for a
 * greyed-out "coming soon" placeholder card.
 */
const SPORTS = [
  { name: "Formula 1", href: "table/f1.html", logo: "assets/logos/f1.png" },
  { name: "NBA",       href: "table/nba.html", logo: "assets/logos/nba.png" },
  { name: "EPL",       href: "table/epl.html", logo: "assets/logos/epl.png" },
  { name: "Coming soon", href: null },
  { name: "Coming soon", href: null },
  { name: "Coming soon", href: null },
  { name: "Coming soon", href: null },
  { name: "Coming soon", href: null },
  { name: "Coming soon", href: null },
];

const grid = document.getElementById('sport-grid');
grid.innerHTML = SPORTS.map(s => {
  const iconHtml = s.logo
    ? `<img class="sport-icon" src="${s.logo}" alt="${s.name}" onerror="this.outerHTML='<span class=&quot;sport-icon fallback&quot;></span>'">`
    : `<span class="sport-icon fallback"></span>`;
  if (s.href) {
    return `
      <a class="sport-card" href="${s.href}">
        ${iconHtml}
        <h2>${s.name}</h2>
        <p>View tables</p>
      </a>`;
  }
  return `
    <div class="sport-card placeholder">
      ${iconHtml}
      <h2>${s.name}</h2>
      <p>—</p>
    </div>`;
}).join('');
</script>

</body>
</html>
