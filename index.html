<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live sports data tables — embeddable widgets</title>
<link rel="stylesheet" href="css/site.css?v=2">
<style>
  .hero-grid-wrap {
    position: relative;
    padding: 3rem 1.5rem 2.5rem;
  }
  .hero-grid-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background-image: url('assets/logos/homepage/home-page-background.png');
    background-size: 100% auto;
    background-position: right top;
    background-repeat: no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 75%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 75%, transparent 100%);
  }

  .hero-content {
    max-width: 640px;
    margin: 0 1.5rem 2.5rem;
    color: #111;
  }
  .hero-content h1 {
    font-size: 4rem;
    margin: 0 0 0.75rem;
    line-height: 1.1;
  }
  .hero-content p {
    font-size: 1.3rem;
     max-width: 440px;
    margin: 0;
    line-height: 1.4;
  }

  .section-heading {
    margin: 200px 1.5rem 1rem;
    font-size: 1.1rem;
    color: #111;
  }

  .sport-grid {
    margin: 0 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(350px, 100%), 1fr));
    justify-content: center;
    gap: 1rem;
  }
  @media (max-width: 480px) {
    .sport-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .sport-card {
    aspect-ratio: 14 / 11;
    max-width: 480px;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    text-decoration: none;
    background-size: cover;
    background-position: center;
    transition: border-color 0.15s;
  }
  .sport-card:hover {
    border-color: #e10600;
  }
  .sport-card.placeholder {
    cursor: default;
    border-style: dashed;
  }
  .sport-card.placeholder:hover {
    border-color: #e2e2e2;
  }

  .footer-note {
    max-width: 900px;
    margin: 2.5rem auto 0;
    font-size: 0.8rem;
    color: #999;
    border-top: 1px solid #eee;
    padding: 1rem 1.5rem 0;
  }
</style>
</head>
<body>

<div id="site-nav" data-active="home"></div>

<section class="hero-grid-wrap">
  <div class="hero-content">
    <h1>Live sports data, ready to embed</h1>
    <p>Auto-updating tables for F1, NBA, EPL and more — themeable, embeddable, and export-ready for print.</p>
  </div>

  <h2 class="section-heading">Pick a sport</h2>
  <div class="sport-grid" id="sport-grid"></div>
</section>

<p class="footer-note">
  Each sport page includes multiple tables (standings, results, and more),
  theming options, and print-ready PDF export.
</p>

<script src="js/site-nav.js"></script>
<script>
/**
 * Home page grid — one card per sport.
 * Add a real sport by giving it an href; leave href empty for a
 * greyed-out "coming soon" placeholder card.
 */
const SPORTS = [
  { name: "Formula 1", href: "table/f1.html", card: "assets/logos/f1/f1-card.png" },
  { name: "NBA",       href: "table/nba.html", card: "assets/logos/nba/nba-card.png" },
  { name: "EPL",       href: "table/epl.html", card: "assets/logos/epl/epl-card.png" },
  { name: "AFL",     href: null, card: "assets/logos/afl/afl-card.png" },
  { name: "Cricket", href: null, card: "assets/logos/cricket/cricket-card.png" },
  { name: "Golf",    href: null, card: "assets/logos/golf/golf-card.png" },
  { name: "MLB",     href: null, card: "assets/logos/mlb/mlb-card.png" },
  { name: "NFL",     href: null, card: "assets/logos/nfl/nfl-card.png" },
  { name: "NRL",     href: null, card: "assets/logos/nrl/nrl-card.png" },
];

const grid = document.getElementById('sport-grid');
grid.innerHTML = SPORTS.map(s => {
  const bgStyle = s.card
    ? ` style="background-image: url('${s.card}');"`
    : '';
  if (s.href) {
    return `<a class="sport-card"${bgStyle} href="${s.href}" aria-label="${s.name}"></a>`;
  }
  return `<div class="sport-card placeholder"${bgStyle} aria-label="${s.name} — coming soon"></div>`;
}).join('');
</script>

</body>
</html>
