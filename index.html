<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live sports data tables — embeddable widgets</title>
<link rel="stylesheet" href="css/site.css?v=2">
<style>
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .tagline { color: #666; margin-top: 0; margin-bottom: 2.5rem; }

  .sport-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(252px, 1fr));
    gap: 1rem;
    max-width: 960px;
  }
  .sport-card {
    aspect-ratio: 14 / 11;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    color: #111;
    padding: 1rem;
    background-size: cover;
    background-position: center;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .sport-card:hover {
    border-color: #e10600;
    background-color: #fafafa;
  }
  .sport-card h2 {
    font-size: 1.1rem;
    margin: 0.4rem 0 0.2rem;
  }
  .sport-card p {
    font-size: 0.78rem;
    color: #666;
    margin: 0;
  }

  .sport-card.placeholder {
    cursor: default;
    color: #fff;
    border-style: dashed;
    filter: grayscale(65%) brightness(0.75);
  }
  .sport-card.placeholder:hover {
    border-color: #e2e2e2;
  }
  .sport-card.placeholder h2 {
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .sport-card.placeholder p {
    color: #eee;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .footer-note {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 1rem;
    max-width: 720px;
  }
</style>
</head>
<body>

<div id="site-nav" data-active="home"></div>

<main class="site-main">
  <h1>Live sports data tables</h1>
  <p class="tagline">Pick a sport to see its live, embeddable tables.</p>

  <div class="sport-grid" id="sport-grid"></div>

  <p class="footer-note">
    Each sport page includes multiple tables (standings, results, and more),
    theming options, and print-ready PDF export.
  </p>
</main>

<script src="js/site-nav.js"></script>
<script>
/**
 * Home page grid — one card per sport.
 * Add a real sport by giving it an href; leave href empty for a
 * greyed-out "coming soon" placeholder card.
 */
const SPORTS = [
  { name: "Formula 1", href: "table/f1.html", card: "assets/logos/f1/f1-card.png" },
  { name: "NBA",       href: "table/nba.html", card: "assets/logos/nba/nba-card.png" },
  { name: "EPL",       href: "table/epl.html", card: "assets/logos/epl/epl-card.png" },
  { name: "AFL",     href: null, card: "assets/logos/afl/afl-card.png" },
  { name: "Cricket", href: null, card: "assets/logos/cricket/cricket-card.png" },
  { name: "Golf",    href: null, card: "assets/logos/golf/golf-card.png" },
  { name: "MLB",     href: null, card: "assets/logos/mlb/mlb-card.png" },
  { name: "NFL",     href: null, card: "assets/logos/nfl/nfl-card.png" },
  { name: "NRL",     href: null, card: "assets/logos/nrl/nrl-card.png" },
];

const grid = document.getElementById('sport-grid');
grid.innerHTML = SPORTS.map(s => {
  const bgStyle = s.card
    ? ` style="background-image: url('${s.card}');"`
    : '';
  if (s.href) {
    return `
      <a class="sport-card"${bgStyle} href="${s.href}">
        <p>View tables</p>
      </a>`;
  }
  return `
    <div class="sport-card placeholder"${bgStyle}>
      <h2>${s.name}</h2>
      <p>Coming soon</p>
    </div>`;
}).join('');
</script>

</body>
</html>
